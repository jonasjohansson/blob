<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Glass Blob — hand-held refraction</title>
<style>
  :root{ --bg:#0b0d0a; --fg:#e8efe6; --muted:#9fb09a; --accent:#bfe3a8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  canvas{width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:14px;top:14px;z-index:10;font-size:12px;line-height:1.5;color:var(--muted);
       background:rgba(8,12,8,.45);backdrop-filter:blur(6px);padding:10px 12px;border:1px solid rgba(191,227,168,.18);border-radius:10px;max-width:min(86vw,360px)}
  .hud b{color:var(--fg);font-weight:600}
  .hud kbd{background:rgba(191,227,168,.14);border:1px solid rgba(191,227,168,.25);border-radius:4px;padding:0 5px;color:var(--accent);font-size:11px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button{font:inherit;font-size:11px;color:var(--fg);background:rgba(191,227,168,.10);border:1px solid rgba(191,227,168,.3);
         border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover{background:rgba(191,227,168,.2)}
  button.active{background:var(--accent);color:#0b0d0a;border-color:var(--accent)}
  #status{margin-top:8px;font-size:11px;color:var(--accent)}
  .err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;z-index:20;color:#ffb4b4}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<div class="hud">
  <div><b>Glass Blob</b> — a refractive lens that lives in your hand.</div>
  <div style="margin-top:6px">Hold up a <b>hand</b> to the camera: the glass forms in your palm, drips between your fingers, and stretches as you open it. No hand? It follows your <b>cursor</b>.</div>
  <div class="row">
    <button id="src-cam" class="active">📷 Webcam</button>
    <button id="src-reel">🎞 Reel</button>
    <button id="src-forest">🌲 Forest</button>
  </div>
  <div class="row">
    <button id="hand" class="active">✋ Hand tracking</button>
    <button id="freeze">⏸ Freeze</button>
  </div>
  <div class="row" style="margin-top:6px;color:var(--muted)">
    <span><kbd>D</kbd> dispersion</span><span><kbd>R</kbd> refract</span><span><kbd>W</kbd> wave</span>
  </div>
  <div id="status">starting…</div>
</div>

<div class="err" id="err"></div>

<script id="vert" type="x-shader/x-fragment">
attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
#define MAXL 6

uniform vec2  u_res;
uniform float u_time;
uniform vec2  u_pointer;     // y-up, 0..1 screen
uniform sampler2D u_bg;
uniform vec2  u_bgRes;
uniform int   u_nLobes;
uniform vec2  u_lobePos[MAXL]; // ndc, relative to pointer (x already *aspect)
uniform float u_lobeR[MAXL];   // ndc radius
uniform float u_disp;
uniform float u_refract;
uniform float u_wave;          // 0..1 stretch/wave amount
uniform float u_mirror;        // 1 = mirror x (webcam), 0 = as-is (reel/forest)

vec2 coverUV(vec2 frag){
  float ca = u_res.x/u_res.y, ta = u_bgRes.x/u_bgRes.y;
  vec2 uv = frag/u_res; vec2 c = uv-0.5;
  if(ca>ta) c.y *= ta/ca; else c.x *= ca/ta;
  return c+0.5;
}
vec3 sampleBG(vec2 uv){
  if(u_mirror>0.5) uv.x = 1.0-uv.x;
  uv = clamp(uv,0.0,1.0);
  return texture2D(u_bg, uv).rgb;
}

float field(vec2 q){
  float v = 0.0;
  for(int i=0;i<MAXL;i++){
    if(i>=u_nLobes) break;
    vec2 d = q - u_lobePos[i];
    float r = u_lobeR[i];
    v += (r*r)/max(dot(d,d),1e-5);
  }
  return v;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = coverUV(frag);
  float t = u_time;
  float aspect = u_res.x/u_res.y;

  vec2 ndc = (frag/u_res - u_pointer);
  ndc.x *= aspect;

  float thr = 1.0;
  float f = field(ndc);
  float thickness = smoothstep(thr*0.85, thr*1.9, f);

  float e = 0.0016;
  float fx = field(ndc+vec2(e,0.)) - field(ndc-vec2(e,0.));
  float fy = field(ndc+vec2(0.,e)) - field(ndc-vec2(0.,e));
  vec2 n = normalize(vec2(fx,fy)+1e-5);

  float rim = thickness*(1.0-thickness)*4.0;
  float bend = u_refract*(thickness*0.7 + rim*1.3);
  vec2 off = -n*bend;

  // stretchy vertical "liquid glass" banding — grows as the hand opens
  float band = sin(uv.y*200.0 + t*3.0 + uv.x*6.0);
  off += vec2(band*(0.0012 + 0.006*u_wave), 0.0)*thickness;
  off.y += sin(uv.x*60.0 - t*2.0)*(0.001+0.004*u_wave)*thickness;

  float d = u_disp*(0.4 + rim + u_wave*0.6);
  vec3 col;
  col.r = sampleBG(uv + off*(1.0+d)).r;
  col.g = sampleBG(uv + off            ).g;
  col.b = sampleBG(uv + off*(1.0-d)).b;

  vec3 bg = sampleBG(uv);
  float inside = smoothstep(thr*0.92, thr*1.05, f);
  vec3 outc = mix(bg, col, inside);

  float edge = smoothstep(thr*0.95, thr*1.02, f)*(1.0 - smoothstep(thr*1.02, thr*1.25, f));
  outc += edge*vec3(0.9,1.0,0.85)*0.55;
  outc += rim*vec3(0.12,0.16,0.10);
  outc *= 1.0 - edge*0.15;

  gl_FragColor = vec4(outc,1.0);
}
</script>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/vision_bundle.mjs";

const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl', {antialias:true});
const errEl = document.getElementById('err');
const statusEl = document.getElementById('status');
const setStatus = s => statusEl.textContent = s;
function showErr(m){ errEl.style.display='grid'; errEl.textContent=m; }
if(!gl) showErr('WebGL not available.');

function compile(type, src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert.textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag.textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) showErr(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const tri=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,tri);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const ploc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(ploc); gl.vertexAttribPointer(ploc,2,gl.FLOAT,false,0,0);

const U=n=>gl.getUniformLocation(prog,n);
const u={res:U('u_res'),time:U('u_time'),pointer:U('u_pointer'),bg:U('u_bg'),bgRes:U('u_bgRes'),
  nLobes:U('u_nLobes'),lobePos:U('u_lobePos'),lobeR:U('u_lobeR'),
  disp:U('u_disp'),refract:U('u_refract'),wave:U('u_wave'),mirror:U('u_mirror')};

// ---- texture ----
const tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([30,40,28]));

let video=null, img=null, bgW=1, bgH=1, source='cam'; // 'cam' | 'reel' | 'forest'
let gen=0; // bumps on every source switch; stale async callbacks check against it

async function startCam(){
  const my=++gen; stopMedia();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720},audio:false});
    video=document.createElement('video');
    video.srcObject=stream; video.muted=true; video.playsInline=true; video.autoplay=true;
    await video.play();
    if(my!==gen) return;            // user switched away while we awaited
    bgW=video.videoWidth||1280; bgH=video.videoHeight||720; source='cam';
    setStatus(handOn ? 'show a hand ✋' : 'cursor mode');
  }catch(e){
    if(my!==gen) return;
    showErr('Camera blocked — using forest still. ('+e.message+')');
    setTimeout(()=>errEl.style.display='none',2400);
    loadForest();
  }
}
function startReel(){
  const my=++gen; stopMedia();
  video=document.createElement('video');
  video.src='reel.mp4'; video.muted=true; video.loop=true; video.playsInline=true; video.autoplay=true;
  video.play();
  video.addEventListener('loadeddata',()=>{ if(my!==gen) return; bgW=video.videoWidth; bgH=video.videoHeight; });
  source='reel'; setStatus('reel background — move cursor');
}
function loadForest(){
  const my=++gen; stopMedia();
  img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{ if(my!==gen) return; bgW=img.naturalWidth; bgH=img.naturalHeight; source='forest';
    gl.bindTexture(gl.TEXTURE_2D,tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    setStatus('forest still — move cursor');
  };
  img.onerror=()=>{ if(my!==gen) return; showErr('Could not load forest.jpg'); };
  img.src='forest.jpg'; source='forest';
}
function stopMedia(){
  if(video&&video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
  if(video){ try{video.pause();}catch(e){} }
  video=null; img=null;
}
function uploadVideo(){
  if(video&&video.readyState>=2){
    gl.bindTexture(gl.TEXTURE_2D,tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);
  }
}

// ---- hand tracking ----
let handLandmarker=null, handOn=true, lastVideoTime=-1, smoothHand=null;
async function initHands(){
  try{
    setStatus('loading hand model…');
    const fileset=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm");
    handLandmarker=await HandLandmarker.createFromOptions(fileset,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
      numHands:1, runningMode:"VIDEO"
    });
    setStatus('show a hand ✋');
  }catch(e){
    handOn=false; document.getElementById('hand').classList.remove('active');
    setStatus('hand model failed — cursor mode');
  }
}

// ---- interaction ----
let pointer={x:.5,y:.5}, target={x:.5,y:.5}, frozen=false;
let params={disp:0.06, refract:0.11, wave:0.0};
function setPointer(ev){
  const r=cvs.getBoundingClientRect();
  const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
  target.x=cx/r.width; target.y=1-cy/r.height;
}
cvs.addEventListener('pointermove',setPointer);
cvs.addEventListener('touchmove',e=>{e.preventDefault();setPointer(e);},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='d')params.disp=params.disp>0.12?0.02:params.disp+0.03;
  if(k==='r')params.refract=params.refract>0.18?0.05:params.refract+0.04;
  if(k==='w')params.wave=params.wave>0.8?0.0:params.wave+0.25;
});
const bCam=document.getElementById('src-cam'),bReel=document.getElementById('src-reel'),bFor=document.getElementById('src-forest');
const bHand=document.getElementById('hand'),bFreeze=document.getElementById('freeze');
function pickSource(btn){[bCam,bReel,bFor].forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
bCam.onclick=()=>{pickSource(bCam);startCam();};
bReel.onclick=()=>{pickSource(bReel);startReel();};
bFor.onclick=()=>{pickSource(bFor);loadForest();};
bHand.onclick=()=>{handOn=!handOn;bHand.classList.toggle('active',handOn);setStatus(handOn?'show a hand ✋':'cursor mode');};
bFreeze.onclick=()=>{frozen=!frozen;bFreeze.classList.toggle('active',frozen);};

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cvs.width=Math.floor(innerWidth*dpr); cvs.height=Math.floor(innerHeight*dpr);
  gl.viewport(0,0,cvs.width,cvs.height);
}
addEventListener('resize',resize); resize();

// map a raw-camera landmark (x L->R, y top->down) to mirrored screen space (x L->R, y UP)
function lmToScreen(lx,ly){
  const ca=cvs.width/cvs.height, ta=bgW/bgH;
  let cx=lx-0.5, cy=ly-0.5;
  if(ca>ta) cy*=ca/ta; else cx*=ta/ca;
  return { x:cx+0.5, yUp:1-(cy+0.5) };
}

// build lobe arrays from hand landmarks; returns {pointer, pos[], r[], n, wave}
function lobesFromHand(lm){
  const palmIdx=[0,5,9,13,17];
  let px=0,py=0; palmIdx.forEach(i=>{px+=lm[i].x;py+=lm[i].y;}); px/=5;py/=5;
  const palm=lmToScreen(px,py);
  const wrist=lmToScreen(lm[0].x,lm[0].y);
  const midTip=lmToScreen(lm[12].x,lm[12].y);
  const span=Math.hypot(midTip.x-wrist.x,midTip.yUp-wrist.yUp)||0.2;
  const aspect=cvs.width/cvs.height;
  const tips=[4,8,12,16,20];
  const pos=[], r=[];
  pos.push([0,0]); r.push(0.62*span);            // palm core lobe
  let open=0;
  for(const ti of tips){                          // fingertip lobes — glass drips to the fingers
    const s=lmToScreen(lm[ti].x,lm[ti].y);
    const dx=(s.x-palm.x)*aspect, dy=(s.yUp-palm.yUp);
    pos.push([dx,dy]); r.push(0.26*span);
    open+=Math.hypot(dx,dy);
  }
  open/=tips.length;
  const wave=Math.max(0,Math.min(1,(open/span-0.55)/0.5));
  return {pointer:{x:palm.x,y:palm.yUp}, pos, r, n:pos.length, wave};
}

// procedural orbiting lobes around the cursor (no-hand fallback)
function lobesProcedural(t){
  const pos=[], r=[]; const N=2;
  for(let i=0;i<N;i++){
    const a=i*2.3+t*(0.6+i*0.25);
    const orbit=i===0?0.05:0.14;
    pos.push([Math.cos(a)*orbit, Math.sin(a*1.3)*orbit]);
    r.push(0.17-i*0.03);
  }
  return {pos,r,n:N};
}

const t0=performance.now();
function frame(now){
  if(source==='cam'||source==='reel') uploadVideo();
  const t=(now-t0)/1000;

  let lobes=null, wave=params.wave;
  if(handOn && handLandmarker && source==='cam' && video && video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    const res=handLandmarker.detectForVideo(video, now);
    if(res.landmarks && res.landmarks.length){
      const h=lobesFromHand(res.landmarks[0]);
      if(!smoothHand) smoothHand={x:h.pointer.x,y:h.pointer.y};
      smoothHand.x+=(h.pointer.x-smoothHand.x)*0.4;
      smoothHand.y+=(h.pointer.y-smoothHand.y)*0.4;
      target.x=smoothHand.x; target.y=smoothHand.y;
      lobes=h; wave=Math.max(params.wave,h.wave);
      setStatus('✋ hand locked · '+(h.wave>0.5?'open/stretchy':'closed'));
    } else {
      setStatus('show a hand ✋');
    }
  }

  if(!frozen){ pointer.x+=(target.x-pointer.x)*0.18; pointer.y+=(target.y-pointer.y)*0.18; }

  if(!lobes){ const p=lobesProcedural(t); lobes={pos:p.pos, r:p.r, n:p.n}; }

  const flatPos=new Float32Array(12), flatR=new Float32Array(6);
  for(let i=0;i<lobes.n;i++){ flatPos[i*2]=lobes.pos[i][0]; flatPos[i*2+1]=lobes.pos[i][1]; flatR[i]=lobes.r[i]; }

  gl.uniform2f(u.res,cvs.width,cvs.height);
  gl.uniform1f(u.time,t);
  gl.uniform2f(u.pointer,pointer.x,pointer.y);
  gl.uniform2f(u.bgRes,bgW,bgH);
  gl.uniform1i(u.nLobes,lobes.n);
  gl.uniform2fv(u.lobePos,flatPos);
  gl.uniform1fv(u.lobeR,flatR);
  gl.uniform1f(u.disp,params.disp);
  gl.uniform1f(u.refract,params.refract);
  gl.uniform1f(u.wave,wave);
  gl.uniform1f(u.mirror, source==='cam'?1:0);
  gl.uniform1i(u.bg,0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}

initHands();
startCam().finally(()=>requestAnimationFrame(frame));
</script>
</body>
</html>
