<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Glass Blob — refraction study</title>
<style>
  :root{
    --bg:#0b0d0a;
    --fg:#e8efe6;
    --muted:#9fb09a;
    --accent:#bfe3a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  canvas{width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  .hud{position:fixed;left:14px;top:14px;z-index:10;font-size:12px;line-height:1.5;color:var(--muted);
       background:rgba(8,12,8,.45);backdrop-filter:blur(6px);padding:10px 12px;border:1px solid rgba(191,227,168,.18);border-radius:10px;max-width:min(86vw,340px)}
  .hud b{color:var(--fg);font-weight:600}
  .hud kbd{background:rgba(191,227,168,.14);border:1px solid rgba(191,227,168,.25);border-radius:4px;padding:0 5px;color:var(--accent);font-size:11px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button{font:inherit;font-size:11px;color:var(--fg);background:rgba(191,227,168,.10);border:1px solid rgba(191,227,168,.3);
         border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover{background:rgba(191,227,168,.2)}
  button.active{background:var(--accent);color:#0b0d0a;border-color:var(--accent)}
  .err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;z-index:20;color:#ffb4b4}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<div class="hud">
  <div><b>Glass Blob</b> — a refractive lens you hold over the world.</div>
  <div style="margin-top:6px">Move the <b>cursor / finger</b> to carry the blob. It bends and chromatically splits whatever is behind it.</div>
  <div class="row">
    <button id="src-cam" class="active">📷 Webcam</button>
    <button id="src-forest">🌲 Forest</button>
    <button id="freeze">⏸ Freeze blob</button>
  </div>
  <div class="row" style="margin-top:6px;color:var(--muted)">
    <span><kbd>1</kbd>–<kbd>3</kbd> blob lobes</span>
    <span><kbd>D</kbd> dispersion</span>
    <span><kbd>R</kbd> refract</span>
  </div>
</div>

<div class="err" id="err"></div>

<script id="vert" type="x-shader/x-fragment">
attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  u_res;       // canvas pixels
uniform float u_time;
uniform vec2  u_pointer;   // 0..1, y up
uniform sampler2D u_bg;
uniform vec2  u_bgRes;     // source texture pixels
uniform float u_lobes;     // 1..3
uniform float u_disp;      // chromatic dispersion
uniform float u_refract;   // refraction strength
uniform float u_blobScale; // overall blob size

// cover-fit the source texture into the canvas, return uv in 0..1
vec2 coverUV(vec2 frag){
  float ca = u_res.x / u_res.y;
  float ta = u_bgRes.x / u_bgRes.y;
  vec2 uv = frag / u_res;          // 0..1, y up
  vec2 c = uv - 0.5;
  if(ca > ta){ c.y *= ta/ca; } else { c.x *= ca/ta; }
  return c + 0.5;
}

vec3 sampleBG(vec2 uv){
  uv.x = 1.0 - uv.x;               // mirror like a selfie / handheld glass
  uv = clamp(uv, 0.0, 1.0);
  return texture2D(u_bg, uv).rgb;
}

// metaball field around the pointer, with a few wobbling lobes
float field(vec2 q, float t){
  float v = 0.0;
  int N = int(u_lobes + 0.5);
  for(int i=0;i<3;i++){
    if(i>=N) break;
    float fi = float(i);
    float a = fi*2.3 + t*(0.6 + fi*0.25);
    float orbit = (i==0)? 0.06 : 0.14 + fi*0.03;
    vec2 c = vec2(cos(a), sin(a*1.3)) * orbit;
    c += vec2(sin(t*0.9+fi)*0.02, cos(t*0.7+fi*2.0)*0.03); // jitter
    float r = (0.16 - fi*0.025) * u_blobScale;
    vec2 d = q - c;
    v += (r*r) / max(dot(d,d), 1e-4);
  }
  return v;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = coverUV(frag);
  float t = u_time;

  // work in aspect-corrected space centred on the pointer
  float aspect = u_res.x / u_res.y;
  vec2 ndc = (frag / u_res - u_pointer);
  ndc.x *= aspect;

  float thr = 1.0;
  float f = field(ndc, t);

  // thickness: 0 outside -> 1 in the fat core
  float thickness = smoothstep(thr*0.85, thr*1.9, f);

  // gradient of the field -> blob surface normal (for refraction direction)
  float e = 0.0016;
  float fx = field(ndc + vec2(e,0.), t) - field(ndc - vec2(e,0.), t);
  float fy = field(ndc + vec2(0.,e), t) - field(ndc - vec2(0.,e), t);
  vec2 grad = vec2(fx, fy);
  vec2 n = normalize(grad + 1e-5);

  // refraction offset: push background along -normal, scaled by thickness
  // (thin rim bends hardest -> classic lens look)
  float rim = thickness*(1.0-thickness)*4.0;          // bright at edge band
  float bend = u_refract * (thickness*0.7 + rim*1.3);
  vec2 off = -n * bend;

  // wavy "stretched glass" banding inside the body
  float wave = sin(uv.y*120.0 + t*2.0 + uv.x*8.0) * 0.0016;
  off += vec2(wave, 0.0) * thickness;

  // chromatic dispersion: split the sample distance per channel
  float d = u_disp * (0.4 + rim);
  vec3 col;
  col.r = sampleBG(uv + off*(1.0 + d)).r;
  col.g = sampleBG(uv + off              ).g;
  col.b = sampleBG(uv + off*(1.0 - d)).b;

  vec3 bg = sampleBG(uv);

  // only show refracted color where the blob is
  float inside = smoothstep(thr*0.92, thr*1.05, f);
  vec3 outc = mix(bg, col, inside);

  // glassy rim highlight + slight tint, like the reel's bright edges
  float edge = smoothstep(thr*0.95, thr*1.02, f) * (1.0 - smoothstep(thr*1.02, thr*1.25, f));
  outc += edge * vec3(0.9, 1.0, 0.85) * 0.55;
  outc += rim * vec3(0.12,0.16,0.10);                 // body sheen

  // faint fresnel darkening at the very outline
  outc *= 1.0 - edge*0.15;

  gl_FragColor = vec4(outc, 1.0);
}
</script>

<script>
const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl', {antialias:true, premultipliedAlpha:false});
const errEl = document.getElementById('err');
if(!gl){ showErr('WebGL not available in this browser.'); }

function showErr(m){ errEl.style.display='grid'; errEl.textContent=m; }

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) showErr(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

// fullscreen triangle
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = name => gl.getUniformLocation(prog, name);
const u = {
  res:U('u_res'), time:U('u_time'), pointer:U('u_pointer'),
  bg:U('u_bg'), bgRes:U('u_bgRes'),
  lobes:U('u_lobes'), disp:U('u_disp'), refract:U('u_refract'), blobScale:U('u_blobScale')
};

// ---- texture (webcam or forest still) ----
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
// seed 1x1 so it renders before media loads
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([30,40,28]));

let video=null, img=null, bgW=1, bgH=1, source='cam';

async function startCam(){
  stopCam();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720},audio:false});
    video = document.createElement('video');
    video.srcObject = stream; video.muted=true; video.playsInline=true; video.autoplay=true;
    await video.play();
    bgW=video.videoWidth||1280; bgH=video.videoHeight||720;
    source='cam';
  }catch(e){
    showErr('Camera blocked — falling back to the forest still. ('+e.message+')');
    setTimeout(()=>{errEl.style.display='none';}, 2600);
    loadForest();
  }
}
function stopCam(){
  if(video && video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); }
  video=null;
}
function loadForest(){
  stopCam();
  img = new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{ bgW=img.naturalWidth; bgH=img.naturalHeight; source='img';
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
  };
  img.onerror=()=>showErr('Could not load forest image.');
  img.src='forest.jpg';
  source='img';
}

function uploadVideo(){
  if(video && video.readyState>=2){
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);
  }
}

// ---- interaction ----
let pointer={x:0.5,y:0.5}, target={x:0.5,y:0.5}, frozen=false;
let params={lobes:2, disp:0.06, refract:0.10, blobScale:1.0};

function setPointer(ev){
  const r = cvs.getBoundingClientRect();
  const cx = (ev.touches? ev.touches[0].clientX : ev.clientX) - r.left;
  const cy = (ev.touches? ev.touches[0].clientY : ev.clientY) - r.top;
  target.x = cx / r.width;
  target.y = 1.0 - cy / r.height;   // flip to y-up
}
cvs.addEventListener('pointermove', setPointer);
cvs.addEventListener('touchmove', e=>{e.preventDefault(); setPointer(e);}, {passive:false});

addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='1') params.lobes=1;
  if(k==='2') params.lobes=2;
  if(k==='3') params.lobes=3;
  if(k==='d') params.disp = params.disp>0.12 ? 0.02 : params.disp+0.03;
  if(k==='r') params.refract = params.refract>0.18 ? 0.05 : params.refract+0.04;
});

const bCam=document.getElementById('src-cam'), bFor=document.getElementById('src-forest'), bFreeze=document.getElementById('freeze');
bCam.onclick=()=>{bCam.classList.add('active');bFor.classList.remove('active');startCam();};
bFor.onclick=()=>{bFor.classList.add('active');bCam.classList.remove('active');loadForest();};
bFreeze.onclick=()=>{frozen=!frozen;bFreeze.classList.toggle('active',frozen);};

// ---- resize ----
function resize(){
  const dpr=Math.min(devicePixelRatio||1, 2);
  cvs.width = Math.floor(innerWidth*dpr);
  cvs.height= Math.floor(innerHeight*dpr);
  gl.viewport(0,0,cvs.width,cvs.height);
}
addEventListener('resize', resize); resize();

// ---- loop ----
const t0=performance.now();
function frame(){
  if(source==='cam') uploadVideo();

  if(!frozen){ pointer.x += (target.x-pointer.x)*0.12; pointer.y += (target.y-pointer.y)*0.12; }

  gl.uniform2f(u.res, cvs.width, cvs.height);
  gl.uniform1f(u.time, (performance.now()-t0)/1000);
  gl.uniform2f(u.pointer, pointer.x, pointer.y);
  gl.uniform2f(u.bgRes, bgW, bgH);
  gl.uniform1f(u.lobes, params.lobes);
  gl.uniform1f(u.disp, params.disp);
  gl.uniform1f(u.refract, params.refract);
  gl.uniform1f(u.blobScale, params.blobScale);
  gl.uniform1i(u.bg, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
startCam().finally(()=>requestAnimationFrame(frame));
</script>
</body>
</html>
