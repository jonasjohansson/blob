<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Glass Blob — hand-held refraction</title>
<style>
  :root{ --bg:#0b0d0a; --fg:#e8efe6; --muted:#9fb09a; --accent:#bfe3a8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  #gl{width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  #skel{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5;display:none}
  #skel.on{display:block}
  .hud{position:fixed;left:14px;top:14px;z-index:10;font-size:12px;line-height:1.5;color:var(--muted);
       background:rgba(8,12,8,.45);backdrop-filter:blur(6px);padding:10px 12px;border:1px solid rgba(191,227,168,.18);border-radius:10px;max-width:min(86vw,360px)}
  .hud b{color:var(--fg);font-weight:600}
  .hud kbd{background:rgba(191,227,168,.14);border:1px solid rgba(191,227,168,.25);border-radius:4px;padding:0 5px;color:var(--accent);font-size:11px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button{font:inherit;font-size:11px;color:var(--fg);background:rgba(191,227,168,.10);border:1px solid rgba(191,227,168,.3);
         border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover{background:rgba(191,227,168,.2)}
  button.active{background:var(--accent);color:#0b0d0a;border-color:var(--accent)}
  #status{margin-top:8px;font-size:11px;color:var(--accent)}
  .panel{position:fixed;right:14px;top:14px;z-index:11;width:230px;font-size:11px;color:var(--fg);
         background:rgba(8,12,8,.55);backdrop-filter:blur(6px);border:1px solid rgba(191,227,168,.18);border-radius:10px;padding:10px 12px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted)}
  .panel-head b{color:var(--fg)}
  .panel-head button{padding:2px 8px;font-size:11px;margin-left:6px}
  .panel.collapsed #tw-rows{display:none}
  .tw{display:block;margin:7px 0}
  .tw-head{display:flex;justify-content:space-between;color:var(--muted)}
  .tw-val{color:var(--accent);font-variant-numeric:tabular-nums}
  .tw input[type=range]{width:100%;margin-top:3px;accent-color:var(--accent)}
  .err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;z-index:20;color:#ffb4b4}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="skel"></canvas></div>

<div class="hud">
  <div><b>Glass Blob</b> — a refractive lens that lives in your hand.</div>
  <div style="margin-top:6px">Hold up a <b>hand</b> to the camera: the glass forms in your palm, drips between your fingers, and stretches as you open it. No hand? It follows your <b>cursor</b>.</div>
  <div class="row">
    <button id="src-cam" class="active">📷 Webcam</button>
    <button id="src-reel">🎞 Reel</button>
    <button id="src-forest">🌲 Forest</button>
  </div>
  <div class="row">
    <button id="hand" class="active">✋ Hand tracking</button>
    <button id="skelbtn" class="active">🦴 Skeleton</button>
    <button id="freeze">⏸ Freeze</button>
  </div>
  <div id="status">starting…</div>
</div>

<div class="panel" id="panel">
  <div class="panel-head">
    <b>Blob controls</b>
    <span><button id="tw-reset">reset</button><button id="tw-toggle">–</button></span>
  </div>
  <div id="tw-rows"></div>
</div>

<div class="err" id="err"></div>

<script id="vert" type="x-shader/x-fragment">
attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
#define MAXL 16

uniform vec2  u_res;
uniform float u_time;
uniform vec2  u_pointer;     // y-up, 0..1 screen (membrane centre)
uniform sampler2D u_bg;
uniform vec2  u_bgRes;
uniform int   u_nLobes;
uniform vec2  u_lobePos[MAXL]; // ndc, relative to pointer (x already *aspect)
uniform float u_lobeR[MAXL];   // ndc radius
uniform float u_disp;
uniform float u_refract;
uniform float u_wave;          // 0..1 stretch/wave amount
uniform float u_waveFreq;      // vertical band frequency
uniform float u_thr;           // metaball edge threshold (blob size/softness)
uniform float u_rim;           // rim highlight / sheen intensity
uniform float u_mirror;        // 1 = mirror x (webcam), 0 = as-is (reel/forest)
uniform vec2  u_stretch;       // unit dir the material is stretched along
uniform float u_two;           // 1 = membrane stretched between two hands
uniform float u_wrinkle;       // cloth fold depth
uniform float u_wrinkleScale;  // cloth fold frequency
uniform float u_irid;          // thin-film iridescence amount

vec2 coverUV(vec2 frag){
  float ca = u_res.x/u_res.y, ta = u_bgRes.x/u_bgRes.y;
  vec2 uv = frag/u_res; vec2 c = uv-0.5;
  if(ca>ta) c.y *= ta/ca; else c.x *= ca/ta;
  return c+0.5;
}
vec3 sampleBG(vec2 uv){
  if(u_mirror>0.5) uv.x = 1.0-uv.x;
  uv = clamp(uv,0.0,1.0);
  return texture2D(u_bg, uv).rgb;
}

float field(vec2 q){
  float v = 0.0;
  for(int i=0;i<MAXL;i++){
    if(i>=u_nLobes) break;
    vec2 d = q - u_lobePos[i];
    float r = u_lobeR[i];
    v += (r*r)/max(dot(d,d),1e-5);
  }
  return v;
}

// value noise + ridged folds for the cloth wrinkles
float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i=floor(p), fp=fract(p); vec2 u=fp*fp*(3.0-2.0*fp);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
float folds(vec2 p){ return 1.0 - abs(2.0*fbm(p)-1.0); } // ridged -> crease lines

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = coverUV(frag);
  float t = u_time;
  float aspect = u_res.x/u_res.y;

  vec2 ndc = (frag/u_res - u_pointer);
  ndc.x *= aspect;

  float thr = u_thr;
  float f = field(ndc);
  float thickness = smoothstep(thr*0.85, thr*1.9, f);
  float inside = smoothstep(thr*0.92, thr*1.05, f);

  float e = 0.0016;
  float fx = field(ndc+vec2(e,0.)) - field(ndc-vec2(e,0.));
  float fy = field(ndc+vec2(0.,e)) - field(ndc-vec2(0.,e));
  vec2 sn = normalize(vec2(fx,fy)+1e-5);  // blob silhouette normal

  // ---- cloth wrinkles: ridged folds running ALONG the stretch direction ----
  vec2 sd = normalize(u_stretch + vec2(1e-4, 1.0e-4));
  vec2 sp = vec2(-sd.y, sd.x);
  float along  = dot(uv, sd);
  float across = dot(uv, sp);
  vec2 wc = vec2(along*u_wrinkleScale*0.5, across*u_wrinkleScale*2.4) + vec2(t*0.04, 0.0);
  float we = 0.05;
  float w0 = folds(wc);
  float wgA = (folds(wc+vec2(we,0.)) - folds(wc-vec2(we,0.)))/(2.0*we);
  float wgB = (folds(wc+vec2(0.,we)) - folds(wc-vec2(0.,we)))/(2.0*we);
  vec2 wgrad = sd*wgA + sp*wgB;                       // fold gradient in uv space
  float clothAmt = u_wrinkle * mix(0.6, 1.0, u_two);   // a touch stronger as a membrane

  float rim = thickness*(1.0-thickness)*4.0;
  float bend = u_refract*(thickness*0.7 + rim*1.3);
  vec2 off = -sn*bend;
  off += wgrad*0.0022*clothAmt*thickness;             // folds bend the background like creased glass

  // base stretch banding
  float band = sin(uv.y*u_waveFreq + t*3.0 + uv.x*6.0);
  off += vec2(band*(0.0012 + 0.006*u_wave), 0.0)*thickness;

  // dispersion is strongest in the folds + at the rim -> the rainbow striations
  float foldEdge = clamp(abs(wgA)*0.5, 0.0, 1.0);
  float d = u_disp*(0.4 + rim + u_wave*0.6 + foldEdge*1.2*clothAmt);
  vec3 col;
  col.r = sampleBG(uv + off*(1.0+d)).r;
  col.g = sampleBG(uv + off            ).g;
  col.b = sampleBG(uv + off*(1.0-d)).b;

  vec3 bg = sampleBG(uv);
  vec3 outc = mix(bg, col, inside);

  // ---- shading: specular off the cloth normal + thin-film iridescence ----
  vec3 N = normalize(vec3(-wgrad*clothAmt*0.18, 1.0));
  vec3 L = normalize(vec3(0.35, 0.65, 0.7));
  float spec = pow(max(dot(N,L),0.0), 22.0);
  outc += spec*thickness*0.5;
  float phase = thickness*2.5 + w0*1.8 + rim*1.5;
  vec3 irid = 0.5 + 0.5*cos(6.2831*(phase + vec3(0.0,0.33,0.67)));
  outc += irid*u_irid*(rim*0.7 + foldEdge*0.5*clothAmt)*inside;

  float edge = smoothstep(thr*0.95, thr*1.02, f)*(1.0 - smoothstep(thr*1.02, thr*1.25, f));
  outc += edge*vec3(0.9,1.0,0.85)*0.55*u_rim;
  outc += rim*vec3(0.12,0.16,0.10)*u_rim;
  outc *= 1.0 - edge*0.15;

  gl_FragColor = vec4(outc,1.0);
}
</script>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/vision_bundle.mjs";

const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl', {antialias:true});
const errEl = document.getElementById('err');
const statusEl = document.getElementById('status');
const setStatus = s => statusEl.textContent = s;
function showErr(m){ errEl.style.display='grid'; errEl.textContent=m; }
if(!gl) showErr('WebGL not available.');

function compile(type, src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert.textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag.textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) showErr(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const tri=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,tri);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const ploc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(ploc); gl.vertexAttribPointer(ploc,2,gl.FLOAT,false,0,0);

const U=n=>gl.getUniformLocation(prog,n);
const u={res:U('u_res'),time:U('u_time'),pointer:U('u_pointer'),bg:U('u_bg'),bgRes:U('u_bgRes'),
  nLobes:U('u_nLobes'),lobePos:U('u_lobePos'),lobeR:U('u_lobeR'),
  disp:U('u_disp'),refract:U('u_refract'),wave:U('u_wave'),mirror:U('u_mirror'),
  waveFreq:U('u_waveFreq'),thr:U('u_thr'),rim:U('u_rim'),
  stretch:U('u_stretch'),two:U('u_two'),wrinkle:U('u_wrinkle'),wrinkleScale:U('u_wrinkleScale'),irid:U('u_irid')};

// ---- texture ----
const tex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([30,40,28]));

let video=null, img=null, bgW=1, bgH=1, source='cam'; // 'cam' | 'reel' | 'forest'
let gen=0; // bumps on every source switch; stale async callbacks check against it

async function startCam(){
  const my=++gen; stopMedia();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:1280,height:720},audio:false});
    video=document.createElement('video');
    video.srcObject=stream; video.muted=true; video.playsInline=true; video.autoplay=true;
    await video.play();
    if(my!==gen) return;            // user switched away while we awaited
    bgW=video.videoWidth||1280; bgH=video.videoHeight||720; source='cam';
    setStatus(handOn ? 'show a hand ✋' : 'cursor mode');
  }catch(e){
    if(my!==gen) return;
    showErr('Camera blocked — using forest still. ('+e.message+')');
    setTimeout(()=>errEl.style.display='none',2400);
    loadForest();
  }
}
function startReel(){
  const my=++gen; stopMedia();
  video=document.createElement('video');
  video.src='reel.mp4'; video.muted=true; video.loop=true; video.playsInline=true; video.autoplay=true;
  video.play();
  video.addEventListener('loadeddata',()=>{ if(my!==gen) return; bgW=video.videoWidth; bgH=video.videoHeight; });
  source='reel'; setStatus('reel background — move cursor');
}
function loadForest(){
  const my=++gen; stopMedia();
  img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{ if(my!==gen) return; bgW=img.naturalWidth; bgH=img.naturalHeight; source='forest';
    gl.bindTexture(gl.TEXTURE_2D,tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    setStatus('forest still — move cursor');
  };
  img.onerror=()=>{ if(my!==gen) return; showErr('Could not load forest.jpg'); };
  img.src='forest.jpg'; source='forest';
}
function stopMedia(){
  if(video&&video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
  if(video){ try{video.pause();}catch(e){} }
  video=null; img=null;
}
function uploadVideo(){
  if(video&&video.readyState>=2){
    gl.bindTexture(gl.TEXTURE_2D,tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);
  }
}

// ---- hand tracking ----
let handLandmarker=null, handOn=true, lastVideoTime=-1, smoothHand=null;
async function initHands(){
  try{
    setStatus('loading hand model…');
    const fileset=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm");
    handLandmarker=await HandLandmarker.createFromOptions(fileset,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
      numHands:2, runningMode:"VIDEO"
    });
    setStatus('show a hand ✋ (or two for a membrane)');
  }catch(e){
    handOn=false; document.getElementById('hand').classList.remove('active');
    setStatus('hand model failed — cursor mode');
  }
}

// ---- interaction ----
let pointer={x:.5,y:.5}, target={x:.5,y:.5}, frozen=false, debug=true;
let lastLandmarks=null, lastHands=[], lastLobes=null;
// persisted hand result — reused between detections (render fps > camera fps) so the blob doesn't flicker
let lastHandLobes=null, lastHandWave=0, handSeenAt=-10, handFresh=false;

// ---- tweakable parameters (driven by the slider panel) ----
const DEFAULTS={
  refract:0.11, disp:0.06, wave:0.0, waveFreq:200, thr:1.0, rim:1.0,
  size:1.0, palm:0.62, tip:0.26, follow:0.18,
  wrinkle:0.6, wrinkleScale:7, irid:0.25, sag:0.5, memWidth:0.5
};
const tw=Object.assign({}, DEFAULTS);
const CONFIG=[
  {k:'refract', label:'Refraction',     min:0,   max:0.35, step:0.005},
  {k:'disp',    label:'Dispersion',     min:0,   max:0.30, step:0.005},
  {k:'wrinkle', label:'Cloth folds',    min:0,   max:2,    step:0.01},
  {k:'wrinkleScale',label:'Fold scale', min:1,   max:20,   step:0.1},
  {k:'irid',    label:'Iridescence',    min:0,   max:1,    step:0.01},
  {k:'wave',    label:'Wave / stretch', min:0,   max:1,    step:0.01},
  {k:'waveFreq',label:'Wave frequency', min:20,  max:420,  step:2},
  {k:'thr',     label:'Edge threshold', min:0.5, max:1.8,  step:0.01},
  {k:'rim',     label:'Rim glow',       min:0,   max:2,    step:0.01},
  {k:'size',    label:'Blob size',      min:0.4, max:2.5,  step:0.01},
  {k:'memWidth',label:'Membrane width', min:0.15,max:1.4,  step:0.01},
  {k:'sag',     label:'Sag / droop',    min:0,   max:1.5,  step:0.01},
  {k:'palm',    label:'Palm radius',    min:0.2, max:1.1,  step:0.01},
  {k:'tip',     label:'Finger radius',  min:0.05,max:0.6,  step:0.01},
  {k:'follow',  label:'Follow smoothing',min:0.04,max:0.6, step:0.01},
];

function setPointer(ev){
  const r=cvs.getBoundingClientRect();
  const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
  target.x=cx/r.width; target.y=1-cy/r.height;
}
cvs.addEventListener('pointermove',setPointer);
cvs.addEventListener('touchmove',e=>{e.preventDefault();setPointer(e);},{passive:false});

// build the slider panel
const panel=document.getElementById('panel'), rowsEl=document.getElementById('tw-rows');
CONFIG.forEach(c=>{
  const row=document.createElement('label'); row.className='tw';
  const name=document.createElement('span'); name.className='tw-name'; name.textContent=c.label;
  const val=document.createElement('span'); val.className='tw-val'; val.textContent=(+tw[c.k]).toFixed(3);
  const s=document.createElement('input'); s.type='range'; s.min=c.min; s.max=c.max; s.step=c.step; s.value=tw[c.k];
  s.oninput=()=>{ tw[c.k]=parseFloat(s.value); val.textContent=(+tw[c.k]).toFixed(3); };
  c._slider=s; c._val=val;
  const head=document.createElement('div'); head.className='tw-head'; head.append(name,val);
  row.append(head,s); rowsEl.appendChild(row);
});
document.getElementById('tw-reset').onclick=()=>{
  CONFIG.forEach(c=>{ tw[c.k]=DEFAULTS[c.k]; c._slider.value=DEFAULTS[c.k]; c._val.textContent=(+DEFAULTS[c.k]).toFixed(3); });
};
document.getElementById('tw-toggle').onclick=()=>panel.classList.toggle('collapsed');

const bCam=document.getElementById('src-cam'),bReel=document.getElementById('src-reel'),bFor=document.getElementById('src-forest');
const bHand=document.getElementById('hand'),bFreeze=document.getElementById('freeze'),bSkel=document.getElementById('skelbtn');
const skel=document.getElementById('skel'), sctx=skel.getContext('2d');
bSkel.onclick=()=>{debug=!debug;bSkel.classList.toggle('active',debug);skel.classList.toggle('on',debug);};
function pickSource(btn){[bCam,bReel,bFor].forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
bCam.onclick=()=>{pickSource(bCam);startCam();};
bReel.onclick=()=>{pickSource(bReel);startReel();};
bFor.onclick=()=>{pickSource(bFor);loadForest();};
bHand.onclick=()=>{handOn=!handOn;bHand.classList.toggle('active',handOn);setStatus(handOn?'show a hand ✋':'cursor mode');};
bFreeze.onclick=()=>{frozen=!frozen;bFreeze.classList.toggle('active',frozen);};

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cvs.width=Math.floor(innerWidth*dpr); cvs.height=Math.floor(innerHeight*dpr);
  skel.width=innerWidth; skel.height=innerHeight;
  gl.viewport(0,0,cvs.width,cvs.height);
}
addEventListener('resize',resize); resize();
if(debug) skel.classList.add('on');

// map a raw-camera landmark (x L->R, y top->down) onto the displayed (mirrored,
// cover-fit) frame. x is MIRRORED to match the selfie view the shader renders.
function lmToScreen(lx,ly){
  const ca=cvs.width/cvs.height, ta=bgW/bgH;
  let cx=0.5-lx, cy=0.5-ly;           // 0.5-lx mirrors x; 0.5-ly flips to y-up
  if(ca>ta) cy*=ca/ta; else cx*=ta/ca;
  return { x:cx+0.5, yUp:cy+0.5 };
}

// extract palm centre, span, fingertips and openness from one hand's landmarks (screen space)
function handInfo(lm){
  const palmIdx=[0,5,9,13,17];
  let px=0,py=0; palmIdx.forEach(i=>{px+=lm[i].x;py+=lm[i].y;}); px/=5;py/=5;
  const palm=lmToScreen(px,py);
  const wrist=lmToScreen(lm[0].x,lm[0].y), midTip=lmToScreen(lm[12].x,lm[12].y);
  const span=Math.hypot(midTip.x-wrist.x,midTip.yUp-wrist.yUp)||0.2;
  const tips=[4,8,12,16,20].map(i=>lmToScreen(lm[i].x,lm[i].y));
  let open=0; tips.forEach(s=>open+=Math.hypot(s.x-palm.x,s.yUp-palm.yUp)); open/=tips.length;
  return {palm,span,tips,open};
}

// single hand -> blob in the palm with fingertip lobes
function lobesFromHand(lm){
  const H=handInfo(lm), palm=H.palm, span=H.span, aspect=cvs.width/cvs.height;
  const pos=[[0,0]], r=[tw.palm*span*tw.size];     // palm core lobe
  H.tips.forEach(s=>{                              // fingertip lobes — glass drips to the fingers
    pos.push([(s.x-palm.x)*aspect, (s.yUp-palm.yUp)]); r.push(tw.tip*span*tw.size);
  });
  const wave=Math.max(0,Math.min(1,(H.open/span-0.55)/0.5));
  return {pointer:{x:palm.x,y:palm.yUp}, pos, r, n:pos.length, wave, stretch:[0,1], two:0};
}

// two hands -> a membrane/cloth stretched between the palms, sagging when close
function lobesTwoHands(lmA,lmB){
  let A=handInfo(lmA), B=handInfo(lmB);
  if(A.palm.x>B.palm.x){ const tmp=A; A=B; B=tmp; }      // order left -> right
  const aspect=cvs.width/cvs.height;
  const M={x:(A.palm.x+B.palm.x)/2, yUp:(A.palm.yUp+B.palm.yUp)/2};
  const toNdc=s=>[(s.x-M.x)*aspect,(s.yUp-M.yUp)];
  let dx=(B.palm.x-A.palm.x)*aspect, dy=(B.palm.yUp-A.palm.yUp);
  const dist=Math.hypot(dx,dy)||0.2; dx/=dist; dy/=dist;
  const avgSpan=(A.span+B.span)/2;
  const taut=Math.min(1, dist/(avgSpan*4.5));            // 0 hands together -> 1 far apart
  const sag=(1-taut)*dist*0.6*tw.sag;                    // mid dips down when slack
  const width=tw.memWidth*avgSpan*tw.size;
  const pos=[toNdc(A.palm), toNdc(B.palm)];
  const r=[0.5*A.span*tw.size, 0.5*B.span*tw.size];
  const K=7;                                             // connector chain forms the sheet
  for(let i=1;i<K;i++){
    const u=i/K;
    const sx=A.palm.x+(B.palm.x-A.palm.x)*u;
    const sy=A.palm.yUp+(B.palm.yUp-A.palm.yUp)*u - sag*Math.sin(Math.PI*u);
    pos.push([(sx-M.x)*aspect,(sy-M.yUp)]); r.push(width);
  }
  [A,B].forEach(Hh=>{ [0,1].forEach(ti=>{ const s=Hh.tips[ti]; pos.push(toNdc(s)); r.push(0.18*Hh.span*tw.size); }); });
  const wave=Math.max(tw.wave, taut);                    // tauter -> more banding/stretch
  return {pointer:{x:M.x,y:M.yUp}, pos, r, n:Math.min(pos.length,16), wave, stretch:[dx,dy], two:1};
}

// procedural orbiting lobes around the cursor (no-hand fallback)
function lobesProcedural(t){
  const pos=[], r=[]; const N=2;
  for(let i=0;i<N;i++){
    const a=i*2.3+t*(0.6+i*0.25);
    const orbit=(i===0?0.05:0.14)*tw.size;
    pos.push([Math.cos(a)*orbit, Math.sin(a*1.3)*orbit]);
    r.push((0.17-i*0.03)*tw.size);
  }
  return {pos,r,n:N,wave:tw.wave,stretch:[0,1],two:0};
}

// ---- debug skeleton overlay ----
const HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
          [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function toPx(lx,ly){ const s=lmToScreen(lx,ly); return [s.x*skel.width,(1-s.yUp)*skel.height]; }
function drawSkeleton(){
  sctx.clearRect(0,0,skel.width,skel.height);
  if(!debug) return;
  // lobe coverage circles (cyan) — shows exactly where the glass sits
  if(lastLobes){
    const aspect=cvs.width/cvs.height;
    sctx.strokeStyle='rgba(120,220,255,.6)'; sctx.lineWidth=1.5;
    for(let i=0;i<lastLobes.n;i++){
      const xUp=pointer.x+lastLobes.pos[i][0]/aspect, yUp=pointer.y+lastLobes.pos[i][1];
      sctx.beginPath(); sctx.arc(xUp*skel.width,(1-yUp)*skel.height,Math.abs(lastLobes.r[i])*skel.height,0,7); sctx.stroke();
    }
  }
  if(source==='cam'){
    for(const lm of lastHands){
      sctx.strokeStyle='rgba(255,255,255,.85)'; sctx.lineWidth=3;
      sctx.beginPath();
      for(const [a,b] of HC){ const pa=toPx(lm[a].x,lm[a].y), pb=toPx(lm[b].x,lm[b].y); sctx.moveTo(pa[0],pa[1]); sctx.lineTo(pb[0],pb[1]); }
      sctx.stroke();
      for(let i=0;i<lm.length;i++){ const p=toPx(lm[i].x,lm[i].y); sctx.fillStyle=(i===0?'#ffd166':'#bfe3a8'); sctx.beginPath(); sctx.arc(p[0],p[1],5,0,7); sctx.fill(); }
    }
  }
  // palm target the blob actually follows (red crosshair)
  const px=pointer.x*skel.width, py=(1-pointer.y)*skel.height;
  sctx.strokeStyle='#ff4d4d'; sctx.lineWidth=2;
  sctx.beginPath(); sctx.moveTo(px-14,py); sctx.lineTo(px+14,py); sctx.moveTo(px,py-14); sctx.lineTo(px,py+14); sctx.stroke();
  sctx.beginPath(); sctx.arc(px,py,16,0,7); sctx.stroke();
}

const t0=performance.now();
function frame(now){
  if(source==='cam'||source==='reel') uploadVideo();
  const t=(now-t0)/1000;

  // run hand detection ONLY when a fresh camera frame is available
  if(handOn && handLandmarker && source==='cam' && video && video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    const res=handLandmarker.detectForVideo(video, now);
    if(res.landmarks && res.landmarks.length){
      lastHands=res.landmarks;
      lastLandmarks=res.landmarks[0];
      const two=res.landmarks.length>=2;
      const h=two ? lobesTwoHands(res.landmarks[0],res.landmarks[1]) : lobesFromHand(res.landmarks[0]);
      if(!smoothHand) smoothHand={x:h.pointer.x,y:h.pointer.y};
      smoothHand.x+=(h.pointer.x-smoothHand.x)*0.5;
      smoothHand.y+=(h.pointer.y-smoothHand.y)*0.5;
      target.x=smoothHand.x; target.y=smoothHand.y;
      lastHandLobes=h; lastHandWave=h.wave; handSeenAt=t;
      setStatus(two ? '✋✋ membrane stretched between hands' : '✋ hand locked · '+(h.wave>0.5?'open/stretchy':'closed'));
    }
  }

  // grace window: keep using the last hand result between detections so nothing blinks
  handFresh = handOn && source==='cam' && (t-handSeenAt)<0.5;
  if(!handFresh){ lastLandmarks=null; lastHands=[]; if(source==='cam') setStatus(handOn?'show a hand ✋ (or two)':'cursor mode'); }

  if(!frozen){ pointer.x+=(target.x-pointer.x)*tw.follow; pointer.y+=(target.y-pointer.y)*tw.follow; }

  let lobes, wave;
  if(handFresh && lastHandLobes){ lobes=lastHandLobes; wave=Math.max(tw.wave,lastHandWave); }
  else { lobes=lobesProcedural(t); wave=tw.wave; }
  lastLobes=lobes;
  const stretch=lobes.stretch||[0,1], two=lobes.two||0;

  const flatPos=new Float32Array(32), flatR=new Float32Array(16);
  for(let i=0;i<lobes.n;i++){ flatPos[i*2]=lobes.pos[i][0]; flatPos[i*2+1]=lobes.pos[i][1]; flatR[i]=lobes.r[i]; }

  gl.uniform2f(u.res,cvs.width,cvs.height);
  gl.uniform1f(u.time,t);
  gl.uniform2f(u.pointer,pointer.x,pointer.y);
  gl.uniform2f(u.bgRes,bgW,bgH);
  gl.uniform1i(u.nLobes,lobes.n);
  gl.uniform2fv(u.lobePos,flatPos);
  gl.uniform1fv(u.lobeR,flatR);
  gl.uniform1f(u.disp,tw.disp);
  gl.uniform1f(u.refract,tw.refract);
  gl.uniform1f(u.wave,wave);
  gl.uniform1f(u.waveFreq,tw.waveFreq);
  gl.uniform1f(u.thr,tw.thr);
  gl.uniform1f(u.rim,tw.rim);
  gl.uniform2f(u.stretch,stretch[0],stretch[1]);
  gl.uniform1f(u.two,two);
  gl.uniform1f(u.wrinkle,tw.wrinkle);
  gl.uniform1f(u.wrinkleScale,tw.wrinkleScale);
  gl.uniform1f(u.irid,tw.irid);
  gl.uniform1f(u.mirror, source==='cam'?1:0);
  gl.uniform1i(u.bg,0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.drawArrays(gl.TRIANGLES,0,3);

  drawSkeleton();
  requestAnimationFrame(frame);
}

initHands();
startCam().finally(()=>requestAnimationFrame(frame));
</script>
